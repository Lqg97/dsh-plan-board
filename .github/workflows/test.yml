name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js
          node --check src/scan-plans.mjs
          node --check src/stage-rules.mjs
          node --check src/board.mjs
      - name: Unit tests
        run: node --test test/*.test.mjs
